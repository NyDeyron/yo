<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест ПДД — мини</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🚗 Тест ПДД</h1>

  <!-- Выбор языка и категории -->
  <div class="controls">
    <div id="lang" class="group">
      <label><input type="radio" name="lang" id="bg" checked> BG</label>
      <label><input type="radio" name="lang" id="en"> EN</label>
    </div>
    <div id="cat" class="group">
      <label><input type="radio" name="cat" id="m"> M</label>
      <label><input type="radio" name="cat" id="a"> A</label>
      <label><input type="radio" name="cat" id="b" checked> B</label>
      <label><input type="radio" name="cat" id="t"> T</label>
    </div>
  </div>

  <!-- Выбор темы -->
  <div id="dropdown" class="dropdown">
    <button class="dropdown-toggle disabled" type="button">
      <span class="icon">☰</span> Выберите тему
    </button>
    <ul class="dropdown-menu">
      <li><a href="#">Тема 01</a></li>
      <li><a href="#">Тема 02</a></li>
      <li><a href="#">Тема 03</a></li>
      <li><a href="#">Тема 04</a></li>
      <li><a href="#">Тема 05</a></li>
      <li><a href="#">Тема 06</a></li>
      <li><a href="#">Тема 07</a></li>
      <li><a href="#">Тема 08</a></li>
      <li><a href="#">Тема 09</a></li>
      <li><a href="#">Тема 10</a></li>
      <li><a href="#">Тема 11</a></li>
      <li><a href="#">Тема 12</a></li>
      <li><a href="#">Тема 13</a></li>
      <li><a href="#">Тема 14</a></li>
      <li><a href="#">Тема 15</a></li>
      <li><a href="#">Тема 16</a></li>
      <li><a href="#">Тема 17</a></li>
      <li><a href="#">Тема 18</a></li>
      <li><a href="#">Тема 19 (Случайный)</a></li>
    </ul>
  </div>

  <!-- Зона вопроса -->
  <div id="mid"></div>

  <!-- Кнопка -->
  <button id="my-btn" class="btn disabled">[0/0][0%]</button>

  <!-- Результаты -->
  <div id="correct" class="result"></div>
  <div id="wrong" class="result"></div>
  <div id="results"></div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
